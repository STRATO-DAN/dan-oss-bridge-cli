name: Publish

# Publishes to PyPI on a GitHub Release being published (a deliberate, human-triggered action).
# Uses PyPI Trusted Publishing (OIDC) -- no long-lived API token stored anywhere, nothing to leak,
# nothing that depends on any one machine being reachable. One-time setup required on PyPI's side:
# https://pypi.org/manage/project/dan-oss-bridge/settings/publishing/ -> add a trusted publisher for
# this exact repo (STRATO-DAN/dan-oss-bridge-cli), workflow file (publish.yml), and environment (pypi).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # required for PyPI trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m unittest discover -s tests
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
