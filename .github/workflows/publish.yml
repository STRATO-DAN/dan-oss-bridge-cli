name: Publish to PyPI

# Publishes dan-oss-bridge to PyPI on a published GitHub Release (or a manual run), using PyPI
# Trusted Publishing (OIDC) — no API token or stored secret. The (owner, repo, workflow filename,
# environment) must match the trusted publisher configured on PyPI for this project.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dan-oss-bridge
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify the package version matches the release tag
        if: github.event_name == 'release'
        run: |
          PKG_VER=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          TAG=${GITHUB_REF_NAME#v}
          echo "package version: $PKG_VER  release tag: $TAG"
          test "$PKG_VER" = "$TAG"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
