name: Publish to PyPI

# Publishes dan-oss-bridge to PyPI when a GitHub Release is published, using PyPI Trusted
# Publishing (OIDC) — no API token or stored secret. The exact (owner, repo, workflow filename,
# environment) below must match the pending/trusted publisher configured on PyPI for this project.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build sdist + wheel and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dan-oss-bridge
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify version matches the release tag
        run: |
          PKG_VER="$(python - <<'PY'
import tomllib
print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])
PY
)"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package version: $PKG_VER  release tag: $TAG"
          if [ "$PKG_VER" != "$TAG" ]; then
            echo "::error::pyproject version ($PKG_VER) does not match the release tag ($TAG)"; exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
